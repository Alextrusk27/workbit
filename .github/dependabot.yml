version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [ minor, patch ]
