name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/workbit-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B verify

  backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist

  deploy:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose and Caddyfile
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy" \
            compose.prod.yml Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/workbit/"

      - name: Pin image and restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/workbit
          image="${{ env.IMAGE }}:${{ github.sha }}"
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$image|" .env
          else
            echo "BACKEND_IMAGE=$image" >> .env
          fi
          token=$(curl -s -H 'Metadata-Flavor: Google' \
            'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token' \
            | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          docker login --username iam --password "$token" cr.yandex
          docker compose -f compose.prod.yml pull backend
          docker compose -f compose.prod.yml up -d
          docker compose -f compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          EOF

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://workbit.ru/api/v1/auth/me || true)
            if [ "$code" = "401" ]; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not answer 401 within 150s (last code: $code)"
          exit 1

      - name: Upload frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/workbit/www/"
