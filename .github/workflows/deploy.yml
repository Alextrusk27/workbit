name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/workbit-backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B verify

  backend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3.0.2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Upload compose and Caddyfile
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy" \
            compose.prod.yml Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/workbit/"

      - name: Render .env from workbit-secrets and restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/workbit
          image="${{ env.IMAGE }}:${{ github.sha }}"
          prev=$(grep '^BACKEND_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)
          git -C secrets pull --ff-only
          umask 077
          : > .env.tmp
          for f in secrets/prod/*.env; do
            sops -d "$f" >> .env.tmp
            echo >> .env.tmp
          done
          token=$(curl -s -H 'Metadata-Flavor: Google' \
            'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token' \
            | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          docker login --username iam --password "$token" cr.yandex
          docker pull "$image"
          echo "BACKEND_IMAGE=$image" >> .env.tmp
          mv .env.tmp .env
          if ! docker compose -f compose.prod.yml up -d --wait --wait-timeout 300; then
            echo "new backend did not become healthy"
            if [ -n "$prev" ] && [ "$prev" != "$image" ]; then
              echo "rolling back to $prev"
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$prev|" .env
              docker compose -f compose.prod.yml up -d --wait --wait-timeout 300 \
                && echo "rollback done: prod is back on $prev" \
                || echo "ROLLBACK FAILED: prod needs manual attention"
            else
              echo "no previous image to roll back to"
            fi
            exit 1
          fi
          docker compose -f compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker images "${{ env.IMAGE }}" --format '{{.Repository}}:{{.Tag}}' \
            | while read -r img; do
                [ "$img" = "$image" ] && continue
                [ "$img" = "$prev" ] && continue
                docker rmi "$img" || echo "failed to remove $img"
              done
          EOF

      - name: Smoke test backend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://workbit.ru/api/v1/auth/me || true)
            if [ "$code" = "401" ]; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not answer 401 within 150s (last code: $code)"
          exit 1

      - name: Upload frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/workbit/www/"

      - name: Smoke test frontend
        run: |
          html=$(curl -sf https://workbit.ru/) || { echo "index.html is not served"; exit 1; }
          echo "$html" | grep -q 'id="root"' || { echo "served HTML has no app root"; exit 1; }
          asset=$(echo "$html" | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "no js bundle referenced in index.html"; exit 1; }
          ctype=$(curl -s -o /dev/null -w '%{content_type}' "https://workbit.ru$asset")
          case "$ctype" in
            *javascript*) echo "frontend is up ($asset)" ;;
            *) echo "bundle $asset served as '$ctype' instead of javascript"; exit 1 ;;
          esac

  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
