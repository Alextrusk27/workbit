name: Security scan

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan repo dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: workbit-backend:scan
          cache-from: type=gha

      - name: Trivy scan docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: workbit-backend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
