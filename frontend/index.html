<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Тренажёр собеседований с AI: интервью по вакансии с hh.ru и тренировка отдельного навыка, разбор каждого ответа и честная оценка — как на настоящем интервью."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Workbit — тренажёр собеседований с AI</title>
    <script>
      const stored = localStorage.getItem('theme')
      if (
        stored === 'dark' ||
        (stored !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
