<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Тренажёр собеседований с AI: реалистичные вопросы под профессию и уровень, разбор каждого ответа и честная оценка — как на настоящем интервью."
    />
    <title>workbit — AI-интервью</title>
    <script>
      const stored = localStorage.getItem('theme')
      if (
        stored === 'dark' ||
        (stored !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
