app:
  security:
    rate-limit:
      limit: 100
    cors:
      allowed-origins: http://localhost:5173
  mail:
    base-url: http://localhost:5173
  email:
    hash-secret: dev-email-hash-secret-not-used-in-production

spring:
  flyway:
    placeholders:
      payment_inv_id_start: 1000
      email_hash_secret: dev-email-hash-secret-not-used-in-production
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
      properties:
        hibernate:
          generate_statistics: true
  datasource:
    username: dev
    password: dev
    url: jdbc:postgresql://localhost:5432/workbit_dev_db
  mail:
    properties:
      mail.smtp.ssl.trust: "*"

jwt:
  secret: test-secret-key-not-used-in-production-123
  expiration: 3600000

billing:
  robokassa:
    merchant-login: ${ROBOKASSA_MERCHANT_LOGIN:workbit-dev}
    password1: ${ROBOKASSA_PASSWORD1:dev-password1}
    password2: ${ROBOKASSA_PASSWORD2:dev-password2}
    test: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    ru.workbit.llm: DEBUG
