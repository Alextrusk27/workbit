app:
  security:
    cors:
      allowed-origins: http://localhost:5173
  mail:
    base-url: http://localhost:5173

spring:
  sql:
    init:
      mode: always
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
      properties:
        hibernate:
          generate_statistics: true
  datasource:
    username: dev
    password: dev
    url: jdbc:postgresql://localhost:5432/workbit_dev_db
  mail:
    properties:
      mail.smtp.ssl.trust: "*"

jwt:
  secret: test-secret-key-not-used-in-production-123
  expiration: 3600000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

llm:
  yandex-ai:
    log-level: debug

logging:
  level:
    root: INFO
    ru.workbit.llm: DEBUG
