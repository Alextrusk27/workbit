app:
  name: "workbit-app"
  security:
    refresh-token-ttl: ${REFRESH_TOKEN_EXPIRATION:30d}
    rate-limit:
      limit: ${RATE_LIMIT_LIMIT:5}
      window: ${RATE_LIMIT_WINDOW:15m}
      verify-code:
        limit: ${VERIFY_CODE_RATE_LIMIT_LIMIT:10}
        window: ${VERIFY_CODE_RATE_LIMIT_WINDOW:15m}
      suggest:
        limit: ${SUGGEST_RATE_LIMIT_LIMIT:60}
        window: ${SUGGEST_RATE_LIMIT_WINDOW:1m}
      normalize:
        limit: ${NORMALIZE_RATE_LIMIT_LIMIT:10}
        window: ${NORMALIZE_RATE_LIMIT_WINDOW:1m}
      stt:
        limit: ${STT_RATE_LIMIT_LIMIT:60}
        window: ${STT_RATE_LIMIT_WINDOW:1h}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://workbit.ru}
  mail:
    from-name: Workbit
    from-mail: noreply@workbit.ru
    base-url: https://workbit.ru

server:
  shutdown: graceful

spring:
  application:
    name: ${app.name}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    placeholders:
      payment_inv_id_start: ${PAYMENT_INV_ID_START:1000000}
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  mail:
    host: mail.workbit.ru
    port: 465
    username: ${app.mail.from-mail}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:15m}

billing:
  robokassa:
    merchant-login: ${ROBOKASSA_MERCHANT_LOGIN}
    password1: ${ROBOKASSA_PASSWORD1}
    password2: ${ROBOKASSA_PASSWORD2}
    test: ${ROBOKASSA_TEST:false}
    payment-url: https://auth.robokassa.ru/Merchant/Index.aspx
    state-url: https://auth.robokassa.ru/Merchant/WebService/Service.asmx/OpStateExt

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

llm:
  yandex-ai:
    folder: ${YANDEX_FOLDER_ID}
    api-key: ${YANDEX_API_KEY}
    log-level: ${LLM_LOG_LEVEL:info}
    agents:
      training-question-generator-noexp: ${TQG_NOEXP}
      training-question-generator-junior: ${TQG_JUNIOR}
      training-question-generator-middle: ${TQG_MIDDLE}
      training-question-generator-senior: ${TQG_SENIOR}
      training-reviewer: ${TRAINING_REVIEWER}
      training-reference-answer: ${TRAINING_REFERENCE_ANSWER}
      interview-question-generator-exp0: ${IQG_EXP0}
      interview-question-generator-exp1: ${IQG_EXP1}
      interview-question-generator-exp3: ${IQG_EXP3}
      interview-question-generator-exp6: ${IQG_EXP6}
      interview-follow-up-exp0: ${IFU_EXP0}
      interview-follow-up-exp1: ${IFU_EXP1}
      interview-follow-up-exp3: ${IFU_EXP3}
      interview-follow-up-exp6: ${IFU_EXP6}
      interview-reviewer-exp0: ${IRV_EXP0}
      interview-reviewer-exp1: ${IRV_EXP1}
      interview-reviewer-exp3: ${IRV_EXP3}
      interview-reviewer-exp6: ${IRV_EXP6}
      input-normalizer: ${INPUT_NORMALIZER}

speech:
  yandex:
    api-key: ${YANDEX_API_KEY}
    host: stt.api.cloud.yandex.net
    port: 443

hh:
  api:
    base-url: https://api.hh.ru
    user-agent: ${HH_USER_AGENT}
    app-token: ${HH_APP_TOKEN}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [req:%X{requestId:-} ip:%X{ip:-} uid:%X{uid:-}] %logger{39} : %m%n"