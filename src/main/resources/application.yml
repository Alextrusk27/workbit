app:
  name: "workbit-app"
  security:
    refresh-token-ttl: ${REFRESH_TOKEN_EXPIRATION:30d}
    rate-limit:
      limit: ${RATE_LIMIT_LIMIT:5}
      window: ${RATE_LIMIT_WINDOW:15m}
      suggest:
        limit: ${SUGGEST_RATE_LIMIT_LIMIT:60}
        window: ${SUGGEST_RATE_LIMIT_WINDOW:1m}
      normalize:
        limit: ${NORMALIZE_RATE_LIMIT_LIMIT:10}
        window: ${NORMALIZE_RATE_LIMIT_WINDOW:1m}
      stt:
        limit: ${STT_RATE_LIMIT_LIMIT:60}
        window: ${STT_RATE_LIMIT_WINDOW:1h}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://workbit.ru}
  mail:
    from-name: Workbit
    from-mail: noreply@workbit.ru
    base-url: https://workbit.ru
    reset-ttl-minutes: 15

spring:
  application:
    name: ${app.name}
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  mail:
    host: mail.workbit.ru
    port: 465
    username: ${app.mail.from-mail}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:15m}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

llm:
  yandex-ai:
    folder: ${YANDEX_FOLDER_ID}
    api-key: ${YANDEX_API_KEY}
    log-level: ${LLM_LOG_LEVEL:info}
    agents:
      training-question-generator: ${TRAINING_QUESTION_GENERATOR}
      training-follow-up: ${TRAINING_FOLLOW_UP}
      training-reviewer: ${TRAINING_REVIEWER}
      interview-question-generator-noexp: ${IQG_NOEXP}
      interview-question-generator-junior: ${IQG_JUNIOR}
      interview-question-generator-middle: ${IQG_MIDDLE}
      interview-question-generator-senior: ${IQG_SENIOR}
      interview-follow-up-noexp: ${IFU_NOEXP}
      interview-follow-up-junior: ${IFU_JUNIOR}
      interview-follow-up-middle: ${IFU_MIDDLE}
      interview-follow-up-senior: ${IFU_SENIOR}
      interview-reviewer-noexp: ${IRV_NOEXP}
      interview-reviewer-junior: ${IRV_JUNIOR}
      interview-reviewer-middle: ${IRV_MIDDLE}
      interview-reviewer-senior: ${IRV_SENIOR}
      input-normalizer: ${INPUT_NORMALIZER}

speech:
  yandex:
    api-key: ${YANDEX_API_KEY}
    host: stt.api.cloud.yandex.net
    port: 443

hh:
  api:
    base-url: https://api.hh.ru
    user-agent: ${HH_USER_AGENT}
    app-token: ${HH_APP_TOKEN}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [req:%X{requestId:-} ip:%X{ip:-} uid:%X{uid:-}] %logger{39} : %m%n"