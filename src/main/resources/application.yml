app:
  name: "workbit-app"
  security:
    refresh-token-ttl: ${REFRESH_TOKEN_EXPIRATION:30d}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://workbit.ru}
  mail:
    from-name: Workbit
    from-mail: noreply@workbit.ru
    base-url: https://workbit.ru
    reset-ttl-minutes: 15

spring:
  application:
    name: ${app.name}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  mail:
    host: mail.workbit.ru
    port: 465
    username: ${app.mail.from-mail}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:15m}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

llm:
  yandex-ai:
    folder: ${YANDEX_FOLDER_ID}
    api-key: ${YANDEX_API_KEY}
    agents:
      answer-evaluator: ${ANSWER_EVALUATOR}
      interview-reviewer: ${INTERVIEW_REVIEWER}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [req:%X{requestId:-} ip:%X{ip:-} uid:%X{uid:-}] %logger{39} : %m%n"