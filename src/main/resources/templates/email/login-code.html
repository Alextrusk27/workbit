<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код для входа</title>
</head>
<body style="margin:0; padding:0; background:#faf9fb;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#faf9fb; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background:#ffffff; border:1px solid #eaeaec;
                          border-radius:16px; overflow:hidden;
                          font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
                          color:#17162b;">
                <tr>
                    <td style="padding:28px 40px 20px; border-bottom:1px solid #eaeaec;">
                        <div translate="no" style="font-size:25px; font-weight:800; letter-spacing:-0.02em;
                                                  line-height:1; color:#17162b;">work<span
                                style="color:#8b5cf6;">bit.</span></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 40px 32px;">
                        <h1 style="margin:0 0 20px; font-size:24px; font-weight:700;
                                   letter-spacing:-0.025em; line-height:1.2; color:#17162b;
                                   text-wrap:balance;">
                            Код для входа
                        </h1>
                        <p style="margin:0 0 28px; font-size:15px; line-height:1.6; color:#5b5f73;">
                            Здравствуйте! Введите этот код на странице входа, чтобы продолжить.
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="border-radius:10px; background:#f3f2f9; border:1px solid #eaeaec;
                                           padding:16px 28px; font-size:34px; font-weight:700;
                                           letter-spacing:0.18em; color:#6366f1;"
                                    th:text="${code}">000000
                                </td>
                            </tr>
                        </table>
                        <p style="margin:24px 0 0; font-size:14px; line-height:1.5; color:#5b5f73;">
                            Код действует 15 минут и работает один раз.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px; border-top:1px solid #eaeaec; background:#faf9fb;
                               font-size:12px; line-height:1.6; color:#6d7187;">
                        Если вы не запрашивали код, просто проигнорируйте это письмо.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
