<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код для входа</title>
</head>
<body style="margin:0; padding:0; background:#f7f5f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f7f5f0; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background:#ffffff; border:1px solid #e4dfd3;
                          border-radius:8px; overflow:hidden;
                          font-family:'Golos Text', system-ui, -apple-system, Arial, sans-serif;
                          color:#1a1a1a;">
                <tr>
                    <td style="padding:28px 40px 20px; border-bottom:1px solid #d8d3c7;">
                        <span style="font-family:Georgia,'Times New Roman',serif; font-size:25px;
                                     font-weight:600; letter-spacing:-0.02em; color:#1a1a1a;">workbit<span style="color:#234c5e;">.</span></span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 40px 32px;">
                        <h1 style="margin:0 0 20px; font-family:Georgia,'Times New Roman',serif;
                                   font-size:24px; font-weight:600; line-height:1.2; color:#1a1a1a;">
                            Код для входа
                        </h1>
                        <p style="margin:0 0 28px; font-size:15px; line-height:1.6; color:#3a382f;">
                            Здравствуйте! Введите этот код на странице входа, чтобы продолжить.
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="border-radius:4px; background:#f7f5f0; border:1px solid #d8d3c7;
                                           padding:16px 28px; font-family:Georgia,'Times New Roman',serif;
                                           font-size:34px; font-weight:600; letter-spacing:0.18em;
                                           color:#234c5e;"
                                    th:text="${code}">000000
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="margin-top:32px;">
                            <tr>
                                <td style="padding:2px 0 2px 16px; border-left:2px solid #3b6e93;">
                                    <p style="margin:0; font-family:Georgia,'Times New Roman',serif;
                                              font-style:italic; font-size:13px; color:#6e6a5f;">
                                        Код действует 15 минут и работает один раз.
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px; border-top:1px solid #d8d3c7; background:#f7f5f0;
                               font-size:12px; line-height:1.6; color:#6e6a5f;">
                        Если вы не запрашивали код, просто проигнорируйте это письмо.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
