<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email</title>
</head>
<body style="margin:0; padding:0; background:#f7f5f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f7f5f0; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background:#ffffff; border:1px solid #e4dfd3;
                          border-radius:8px; overflow:hidden;
                          font-family:'Golos Text', system-ui, -apple-system, Arial, sans-serif;
                          color:#1a1a1a;">
                <tr>
                    <td style="padding:28px 40px 20px; border-bottom:1px solid #d8d3c7;">
                        <span style="font-family:Georgia,'Times New Roman',serif; font-size:25px;
                                     font-weight:600; letter-spacing:-0.02em; color:#1a1a1a;">workbit<span style="color:#234c5e;">.</span></span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 40px 32px;">
                        <h1 style="margin:0 0 20px; font-family:Georgia,'Times New Roman',serif;
                                   font-size:24px; font-weight:600; line-height:1.2; color:#1a1a1a;">
                            Подтвердите email
                        </h1>
                        <p style="margin:0 0 28px; font-size:15px; line-height:1.6; color:#3a382f;">
                            Здравствуйте! Остался один шаг — нажмите на кнопку ниже,
                            чтобы завершить регистрацию.
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="border-radius:4px; background:#234c5e;">
                                    <a th:href="${verificationUrl}"
                                       style="display:inline-block; padding:14px 28px; color:#ffffff;
                                              font-size:15px; font-weight:600; text-decoration:none;
                                              border-radius:4px;">
                                        Подтвердить email
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="margin-top:32px;">
                            <tr>
                                <td style="padding:2px 0 2px 16px; border-left:2px solid #3b6e93;">
                                    <p style="margin:0 0 6px; font-family:Georgia,'Times New Roman',serif;
                                              font-style:italic; font-size:13px; color:#6e6a5f;">
                                        Если кнопка не работает, скопируйте ссылку в браузер:
                                    </p>
                                    <p style="margin:0; font-size:13px; word-break:break-all;">
                                        <a th:href="${verificationUrl}" th:text="${verificationUrl}"
                                           style="color:#234c5e;">https://workbit.ru/...</a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px; border-top:1px solid #d8d3c7; background:#f7f5f0;
                               font-size:12px; line-height:1.6; color:#6e6a5f;">
                        Если вы не регистрировались, просто проигнорируйте это письмо.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
